worker_processes 4;

events {
    worker_connections 1024;
}

http {
    tcp_nodelay on;
    keepalive_timeout 295s;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log info;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Report-only for now: violations are logged to the browser console but not
        # blocked. Tighten to `Content-Security-Policy` (enforcing) once verified clean.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /decrypt/ {
            return 301 /#fallback;
        }

        # `/downloads/postguard-tb-addon.xpi` deliberately has no redirect here.
        # It falls through to the Vite dev server, which serves the mirrored
        # artifact from `static/downloads/` — the same thing prod does from the
        # synced htdocs dir, so dev and prod agree on what that path returns.
        #
        # It used to 302 to `postguard-tb-addon/releases/latest/download/...`.
        # That repo is archived and its `releases/latest` is now the tag
        # `channel-migration-0.9.4`, which carries only `updates.json` and no
        # `.xpi` at all, so the redirect resolved to a hard 404. Do not point a
        # download at another repo's `releases/latest`: it silently re-aims
        # whenever that repo cuts a release, including a release that exists
        # only to move an update channel.

        location = /downloads/updates.json {
            return 302 https://raw.githubusercontent.com/privacybydesign/postguard-js/main/apps/tb-addon/updates.json;
        }

        location ~ ^/downloads/v([\d\.]+)/postguard-tb-addon-([\d\.]+)\.xpi$ {
            return 302 https://github.com/privacybydesign/postguard-js/releases/download/tb-addon-v$1/postguard-tb-addon-$2.xpi;
        }

        location ~ ^/downloads/v([\d\.]+)/updates\.json$ {
            return 302 https://github.com/privacybydesign/postguard-js/releases/download/tb-addon-v$1/updates.json;
        }

        # Proxy PKG to local service
        location /pkg/ {
            proxy_pass http://postguard-pkg:8087/;
        }

        # Proxy IRMA to local service
        location /irma/ {
            proxy_pass http://irma-server:8088/;
        }

        # Proxy everything else to Vite dev server
        location / {
            proxy_pass http://postguard-website:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}

# Updates are grouped (one PR per ecosystem, plus one for its security
# updates) and wait 7 days after a release (cooldown), so compromised releases
# are usually yanked before they reach us. Security updates are not delayed.
version: 2
updates:
    - package-ecosystem: github-actions # also bumps the shared workflows
      directory: /
      schedule: { interval: weekly, day: monday }
      groups:
          actions: { patterns: ['*'] }
          actions-security: { applies-to: security-updates, patterns: ['*'] }
      cooldown: { default-days: 7 }

    - package-ecosystem: docker
      directories: [/apps/website/docker, /apps/outlook-addon]
      schedule: { interval: weekly, day: monday }
      groups:
          docker: { patterns: ['*'] }
      cooldown: { default-days: 7 }

    - package-ecosystem: npm # the pnpm workspace
      directory: /
      schedule: { interval: weekly, day: monday }
      # @e4a/* is first-party. @e4a/pg-wasm is the wire-compatibility reader:
      # it is bumped by hand, with the compat gate, never by a bot.
      # packages/pg-js/tests/dependabot-config.test.ts holds this rule in place.
      ignore:
          - dependency-name: '@e4a/*'
      groups:
          npm-production: { dependency-type: production, update-types: [minor, patch] }
          npm-development: { dependency-type: development, update-types: [minor, patch] }
          npm-security: { applies-to: security-updates, patterns: ['*'] }
      cooldown: { default-days: 7 }

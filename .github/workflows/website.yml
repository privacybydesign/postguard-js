name: Website

# Checks and docker delivery for apps/website.
#
# Deliberately NOT path-filtered to apps/website/**: the point of the monorepo
# is that an SDK change in packages/pg-js is tested against its consumers in the
# same PR, which a filter would hide. The check suite is seconds of wall clock.
#
# The image name is hardcoded rather than derived from ${{ github.repository }}:
# that expression resolves to `postguard-js` in this repo, while postguard-ops
# pins ghcr.io/privacybydesign/postguard-website in prod, so deriving it would
# publish to a name nothing deploys.
#
# Publishing happens on main only, in the `image` job. A pull request builds
# and scans the image in status-checks.yml, without a registry write.

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read

defaults:
    run:
        working-directory: apps/website

jobs:
    svelte-check:
        name: Svelte Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - run: corepack enable
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: pnpm
            # From the repo root: the workspace lockfile covers every package,
            # and the website resolves @e4a/pg-js through workspace:*.
            - run: pnpm install --frozen-lockfile
              working-directory: .
            - run: pnpm exec svelte-kit sync
            - run: pnpm exec svelte-check --threshold warning

    test-unit:
        name: Unit Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - run: corepack enable
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
              working-directory: .
            - run: pnpm test:unit

    test-e2e:
        name: E2E Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - run: corepack enable
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
              working-directory: .
            - name: Install Playwright chromium
              run: pnpm exec playwright install --with-deps chromium
            - run: pnpm test:e2e
            # Traces (retain-on-failure) and screenshots (only-on-failure) land
            # in test-results/; the html reporter writes playwright-report/.
            - name: Upload Playwright artifacts
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-artifacts
                  path: |
                      apps/website/playwright-report/
                      apps/website/test-results/
                  retention-days: 7

    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - run: corepack enable
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: 24
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
              working-directory: .
            - run: pnpm exec svelte-kit sync
            - run: pnpm lint
            # Fail on references to undefined CSS custom properties.
            - run: pnpm lint:css

    nginx:
        # Qualified with the app — see the matching note in outlook-addon.yml.
        # Both jobs were called `nginx config test`, and a required status check
        # is matched by name across the whole repo, so the two were
        # indistinguishable to branch protection.
        name: nginx config test (website)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
              with:
                  python-version: '3.x'
            - run: pip install crossplane
              working-directory: .

            # Dev config is a full standalone nginx.conf; --single-file skips the
            # include of /etc/nginx/mime.types (absent in CI, not a syntax concern).
            - name: Validate docker/nginx.dev.conf
              run: |
                  crossplane parse --single-file -o /tmp/dev.json docker/nginx.dev.conf
                  python -c "import json,sys; d=json.load(open('/tmp/dev.json')); [print('::error file=apps/website/docker/nginx.dev.conf,line={}::{}'.format(e.get('line'), e['error'])) for e in d.get('errors', [])]; sys.exit(0 if d['status']=='ok' else 1)"

            # Prod server template is rendered by the image's envsubst entrypoint
            # into conf.d at runtime; render its two upstream vars and wrap in
            # http{} so it is parsed in the context it actually runs in.
            - name: Validate docker/default.conf.template
              run: |
                  # The single quotes are the point: envsubst takes the variable
                  # NAMES, so the shell must not expand them.
                  # shellcheck disable=SC2016
                  IRMA_UPSTREAM_URL=http://irma-server:8088 PKG_UPSTREAM_URL=http://postguard-pkg:8087 \
                    envsubst '${IRMA_UPSTREAM_URL} ${PKG_UPSTREAM_URL}' < docker/default.conf.template > /tmp/server.conf
                  { echo 'events {}'; echo 'http {'; cat /tmp/server.conf; echo '}'; } > /tmp/prod-nginx.conf
                  crossplane parse -o /tmp/prod.json /tmp/prod-nginx.conf
                  python -c "import json,sys; d=json.load(open('/tmp/prod.json')); [print('::error file=apps/website/docker/default.conf.template::{}'.format(e['error'])) for e in d.get('errors', [])]; sys.exit(0 if d['status']=='ok' else 1)"

    # The version the image is published under, read from the app's manifest.
    # Its own job because a reusable workflow takes inputs, not steps.
    version:
        name: Website version
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        outputs:
            value: ${{ steps.version.outputs.value }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  persist-credentials: false
            # Two statements, not `echo "value=$(...)"`: echo's own exit status
            # would mask a failing substitution under the default `bash -e`, and
            # the step would emit `value=` and pass, publishing only :edge with
            # the version tag silently missing.
            - name: Read the app version
              id: version
              working-directory: .
              run: |
                  version="$(node -p "require('./apps/website/package.json').version")"
                  echo "value=$version" >> "$GITHUB_OUTPUT"

    # Publishes from main only, through the shared workflow: the image is built
    # once, scanned, and only then pushed, as :edge and as :<version>. A pull
    # request builds and scans the same Dockerfile in status-checks.yml, without
    # a registry write. Context is the repo root: the site depends on @e4a/pg-js
    # as workspace:*, so the image build installs the workspace and builds the
    # SDK first.
    #
    # :<version> is published once. The shared workflow leaves an existing
    # version tag where it is, so it stays on the commit that bumped the version
    # and no longer moves with every push to main.
    image:
        name: Website image
        needs: version
        if: github.event_name == 'push'
        uses: privacybydesign/github-workflows/.github/workflows/docker-publish.yml@e32021c23d7ce9a820642329705d826871aac323
        permissions:
            contents: read
            packages: write
            security-events: write
            id-token: write
            attestations: write
        with:
            image-name: ghcr.io/privacybydesign/postguard-website
            dockerfile: apps/website/docker/Dockerfile
            platforms: linux/amd64,linux/arm64
            version: ${{ needs.version.outputs.value }}

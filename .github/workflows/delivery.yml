name: Delivery

on:
    push:
        branches: [main]

permissions: {}

jobs:
    integration:
        name: Integration
        uses: ./.github/workflows/integration.yml
        permissions:
            contents: read

    release:
        name: Release
        needs: integration
        runs-on: ubuntu-latest
        # contents/pull-requests: changesets pushes the version commit and opens
        # the Version Packages PR. issues: it comments on released issues.
        # id-token: npm trusted publishing and provenance.
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            # The checkout keeps its credentials on purpose: changesets pushes the
            # version commit and its tags with them. This job uploads no artifacts.
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 # zizmor: ignore[artipacked]
              with:
                  fetch-depth: 0

            - name: Setup pnpm
              run: corepack enable

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # The Version Packages PR this opens carries no pre-merge CI:
            # GITHUB_TOKEN-triggered events start no workflows at all. The
            # publish itself stays gated — `needs: integration` runs the full
            # matrix on the version commit's push to main before this job.
            #
            # A script, not changesets/action: that action is not on the
            # privacybydesign allowlist, and a workflow naming it never starts.
            # scripts/changesets-release.sh runs `pnpm version-packages` or
            # `pnpm release`, the same two commands the action was given.
            - name: Version or publish (changesets)
              run: scripts/changesets-release.sh
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # pnpm ignores publishConfig.provenance; the npm-config key
                  # is what `pnpm publish` (via changeset publish) reads.
                  NPM_CONFIG_PROVENANCE: 'true'
                  # `pnpm release` is `pnpm --filter @e4a/pg-js build && changeset
                  # publish` — deliberately filtered, not `pnpm -r build`.
                  #
                  # @e4a/pg-js is the only publishable package here; every app is
                  # private. A recursive build put all three apps' build
                  # preconditions in front of `changeset publish`, so any of them
                  # failing broke the pg-js npm release rather than just its own
                  # image. That already cost one incident via apps/tb-addon, whose
                  # build fail-closes without backend URLs, and apps/outlook-addon
                  # since made it worse: its build now also fails on the *value* of
                  # POSTGUARD_WEBSITE_URL, because the manifest refuses to ship
                  # without an <AppDomain> for the origin it is given. The set of
                  # acceptable values lived in a file in a different app.
                  #
                  # Filtering removes the whole class instead of enumerating it:
                  # the apps are built and published by their own workflows, and
                  # `needs: integration` above still runs the full recursive build
                  # on this commit before anything is released.

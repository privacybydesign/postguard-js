name: Delivery

on:
    push:
        branches: [main]

permissions: {}

jobs:
    integration:
        name: Integration
        uses: ./.github/workflows/integration.yml
        permissions:
            contents: read

    release:
        name: Release
        needs: integration
        runs-on: ubuntu-latest
        # contents/pull-requests: changesets pushes the version commit and opens
        # the Version Packages PR. issues: it comments on released issues.
        # id-token: npm trusted publishing and provenance.
        permissions:
            contents: write
            issues: write
            pull-requests: write
            id-token: write
        steps:
            # The version commit is pushed and the Version Packages PR opened as
            # the org's release App when its two secrets exist, and as
            # GITHUB_TOKEN otherwise. Two things depend on the App:
            # privacybydesign does not let GITHUB_TOKEN open a pull request at
            # all, and a branch GITHUB_TOKEN pushed starts no workflows, so the
            # PR would arrive with every required check absent. Secrets cannot
            # be read in an `if:`, hence the step that turns one into an output.
            - name: Check for the release App
              id: app
              env:
                  APP_ID: ${{ secrets.RELEASE_APP_ID }}
              run: echo "enabled=$([ -n "$APP_ID" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            - name: Create the release App token
              id: token
              if: steps.app.outputs.enabled == 'true'
              uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
              with:
                  app-id: ${{ secrets.RELEASE_APP_ID }}
                  private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
                  permission-contents: write
                  permission-pull-requests: write
                  permission-issues: write
            - name: Warn that GITHUB_TOKEN opens the version PR
              if: steps.app.outputs.enabled != 'true'
              run: echo "::warning::RELEASE_APP_ID is not set, so the Version Packages PR is opened with GITHUB_TOKEN; where the organization forbids that, this job fails."

            # The checkout keeps its credentials on purpose: changesets pushes the
            # version commit and its tags with them, and that push has to come
            # from the same identity that opens the PR. This job uploads no
            # artifacts.
            - name: Checkout
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 # zizmor: ignore[artipacked]
              with:
                  fetch-depth: 0
                  token: ${{ steps.token.outputs.token || github.token }}

            - name: Setup pnpm
              run: corepack enable

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version: '24'
                  registry-url: 'https://registry.npmjs.org'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # Opened by the release App, the Version Packages PR runs its
            # checks like any other. Opened by GITHUB_TOKEN (no App secrets) it
            # carries no pre-merge CI: GITHUB_TOKEN-triggered events start no
            # workflows at all. Either way the publish stays gated — `needs:
            # integration` runs the full matrix on the version commit's push to
            # main before this job.
            #
            # A script, not changesets/action: that action is not on the
            # privacybydesign allowlist, and a workflow naming it never starts.
            # scripts/changesets-release.sh runs `pnpm version-packages` or
            # `pnpm release`, the same two commands the action was given.
            - name: Version or publish (changesets)
              run: scripts/changesets-release.sh
              env:
                  GITHUB_TOKEN: ${{ steps.token.outputs.token || secrets.GITHUB_TOKEN }}
                  # pnpm ignores publishConfig.provenance; the npm-config key
                  # is what `pnpm publish` (via changeset publish) reads.
                  NPM_CONFIG_PROVENANCE: 'true'
                  # `pnpm release` is `pnpm --filter @e4a/pg-js build && changeset
                  # publish` — deliberately filtered, not `pnpm -r build`.
                  #
                  # @e4a/pg-js is the only publishable package here; every app is
                  # private. A recursive build put all three apps' build
                  # preconditions in front of `changeset publish`, so any of them
                  # failing broke the pg-js npm release rather than just its own
                  # image. That already cost one incident via apps/tb-addon, whose
                  # build fail-closes without backend URLs, and apps/outlook-addon
                  # since made it worse: its build now also fails on the *value* of
                  # POSTGUARD_WEBSITE_URL, because the manifest refuses to ship
                  # without an <AppDomain> for the origin it is given. The set of
                  # acceptable values lived in a file in a different app.
                  #
                  # Filtering removes the whole class instead of enumerating it:
                  # the apps are built and published by their own workflows, and
                  # `needs: integration` above still runs the full recursive build
                  # on this commit before anything is released.
